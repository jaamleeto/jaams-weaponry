plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.1.2'
group = 'com.yourname.modid'
archivesBaseName = 'jaams_weaponry'

project.ext.mcVersion = '1.20.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                jaams_weaponry {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                jaams_weaponry {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url 'https://cursemaven.com/' }
    maven { name = "Progwml6's maven"; url = "https://dvs1.progwml6.com/files/maven/" }
    maven { name = "Jared's maven"; url = "https://maven.blamejared.com/" }
    maven { name = "ModMaven"; url = "https://modmaven.dev" }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("curse.maven:configured-457570:5180900")
    implementation fg.deobf("curse.maven:damage-indicator-reborn-1059519:5512460")
    implementation fg.deobf("curse.maven:catalogue-459701:4766090")

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.3.0.8")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.3.0.8")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.3.0.8")

    compileOnly fg.deobf("curse.maven:playeranimator-658587:4587214")
}

mixin {
    add sourceSets.main, 'mixins.jaams_weaponry.refmap.json'

    config 'mixins.jaams_weaponry.json'

    debug.verbose = true
    debug.export = true
    dumpTargetOnFailure = true

    quiet
}

jar {
    archiveFileName = "${archivesBaseName}-${project.version}-forge-${mcVersion}.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
